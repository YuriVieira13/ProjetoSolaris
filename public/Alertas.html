<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas</title>
    <link rel="stylesheet" href="styles/alertas.css" />
    <link rel="stylesheet" href="./dashboard/sidebar.css">
    <link rel="icon" href="assets/icons" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body onload="carregarAlertas()">
    <div class="div_container">
        <aside class="sidebar">
            <img src="./assets/imgs/logo.png" alt="Logo solaris" class="img_logo" />

            <div class="div_barra"></div>

            <nav class="navbar">
                <a href="Dashboard/dashboard.html" class="btn_sidebar">Inicio</a>
                <a href="#" class="btn_sidebar">Relatórios</a>
                <a href="#" class="btn_sidebar">Fazendas</a>
            </nav>

            <div class="div_barra"></div>
            <h4 class="titulo">Configurações da conta</h4>

            <img src="./assets/imgs/Pessoa.png" class="img_perfil" />
            <h4 class="nomeUsuario">Fernando Brandão</h4>
            <button class="btn_sidebar">Configurações</button>
        </aside>
        <div id="main">
            <h3>NOME FAZENDA</h3>
            <h3>RELATORIOS</h3>
            <div id="modal"></div>
        </div>
    </div>

</body>
<script>
    let listaAlertas = [];
    function carregarAlertas() {
        // let idUsuario = sessionStorage.ID_USUARIO;
        let idUsuario = 1;
        let idFazenda = 1;
        // let idFazenda = Number(sessionStorage.ID_FAZENDA);

        fetch(`/area/buscarAlertas/${idUsuario}/${idFazenda}`, {
            method: "GET"
        })
            .then(res => res.json())
            .then(json => {
                listaAlertas = json;
                for (let i = 0; i < json.length; i++) {
                    main.innerHTML += `<button class="alerta" onclick="abrirModal(${i})">
                     ${json[i].nome.toUpperCase()} <span>${json[i].situacao.toUpperCase()} </span> HECTARE ${json[i].idHectare}
                      <i class="bi bi-exclamation-circle"></i></button>`
                }
            })
            .catch(err => {
                console.log(err);
            })
    }

    function abrirModal(i) {
        let alerta = listaAlertas[i];

        let modal = document.getElementById("modal");
        modal.style.display = "flex";

        modal.innerHTML = `<div class="conteudo">
      <h2>DETALHES DO ALERTA</h2>
       <div id="informacoes">
        <p><strong>MOTIVO DO ALERTA:</strong><span> ${alerta.situacao.toUpperCase()}</span></p>
        <p><strong>FAZENDA:</strong><span>${alerta.nome_fazenda.toUpperCase()}</span></p>
        <p><strong>ÁREA:</strong><span>${alerta.nome.toUpperCase()}</span></p>
        <p><strong>HECTARE:</strong><span>HECTARE ${alerta.idHectare}</span></p>
        </div>
      <button onclick="visualizarAlerta(${alerta.idAlerta})">MARCAR COMO VISTO</button>
    </div>`
    }

    function visualizarAlerta(idAlerta) {
        document.getElementById("modal").style.display = "none";

        fetch(`/area/visualizarAlerta/${idAlerta}`, {
            method: "PUT"
        })
            .then(() => {
                main.innerHTML = "";
                carregarAlertas();
            })
            .catch(err => {
                console.log(err);
            })
    }
</script>

</html>
