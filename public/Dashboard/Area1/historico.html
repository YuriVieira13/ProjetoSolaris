<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../sidebar.css" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="./historico.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/verificarCargo.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="div_container">
        <aside class="sidebar">
            <img src="./assets/imgs/logo.png" alt="Logo solaris" class="img_logo" />
            <h4 class="nomeUsuario" id="nomeUsuarioId">—</h4>
            <div class="div_barra"></div>

            <nav class="navbar">
                <a href="./index.html" class="btn_sidebar">Dashboard</a>
                <a class="btn_sidebar" href="./historico.html">Histórico</a>
                <a class="btn_sidebar" href="./funcionariosDash.html" id="btn_usuarios">Usuários</a>
                <a href="../../Alertas.html" class="btn_sidebar">Alertas</a>
                <a href="../dashboard.html" class="btn_sidebar">Selecionar Área</a>
            </nav>

            <div class="div_barra"></div>

            <div class="infoConta">
                <button onclick="irCadastro()" class="btn_sidebar">
                    Cadastrar Funcionário
                </button>
                <button class="btn_sidebar" onclick="sessionStorage.clear(); window.location.href='/index.html';" style="
                            background: rgba(220, 50, 50, 0.25);
                            border-color: rgba(220, 50, 50, 0.5);
                        ">
                    Sair
                </button>
            </div>
        </aside>

        <div class="div_conteudo">
            <div class="header">
                <p class="p_header" id="p_header">Ver Histórico</p>
            </div>

            <div class="main">
                <section class="SelecionarData" id="SelecionarData">
                    <h1 class="tituloData">
                        SELECIONE O INÍCIO DA SEMANA DESEJADA PARA VER AS
                        INFORMAÇÕES
                    </h1>

                    <input type="date" id="ipt_data" name="" class="ipt_data" />

                    <button class="btn_pesquisar" onclick="carregarDados()">
                        Pesquisar
                    </button>
                </section>

                <section class="div_graficos" id="div_graficos">
                    <section class="conteudo">
                        <div class="box interogacao">
                            <button class="btn_interogacao" onclick="SobrePFFD()">
                                <img src="./assets/imgs/interogacao.png" alt="" class="img_interogacao" />
                            </button>
                            <div class="grande">
                                <canvas id="graficoLinha"></canvas>
                            </div>
                        </div>

                        <div class="box mapa">
                            <h3>Mapa de Calor da Propriedade</h3>

                            <div class="grid-mapa" id="gridMapa"></div>
                        </div>
                        <div class="box interogacao">
                            <button class="btn_interogacao" onclick="sobreMeta()">
                                <img src="./assets/imgs/interogacao.png" alt="" class="img_interogacao" />
                            </button>
                            <div class="pequeno">
                                <canvas id="graficoPizza"></canvas>
                            </div>
                        </div>
                    </section>
                </section>
                <button id="btn_voltar" class="btn_voltar" onclick="window.location.href = './historico.html'">
                    Escolher outra data
                </button>
            </div>
        </div>
        <div class="div_modal" id="modal">
            <div class="div_caixaModal">
                <div class="interogacao">
                    <button class="btn_fechar" onclick="fecharModal()">
                        X
                    </button>
                </div>
                <div class="div_contModal">
                    <h3 class="titulo_modal" id="tituloModal"></h3>

                    <span class="p_modal" id="textoModal"></span>
                </div>
            </div>
        </div>

        <div class="icon-bob-AI">
            <a href="../bobAI.html"><img src="../../assets/icons/icon-bob-ai.png" alt="" /></a>
        </div>
    </div>
</body>

<script>
    window.onload = function () {
        var idUsuario = sessionStorage.getItem("ID_USUARIO");
        if (!idUsuario) {
            window.location.href = "../../Login.html";
            return;
        }

        var idFazenda = sessionStorage.getItem("ID_FAZENDA");
        if (!idFazenda) {
            window.location.href = "../fazendas.html";
            return;
        }

        var nomeUsuario = sessionStorage.getItem("NOME_USUARIO") || "—";
        console.log(nomeUsuario);
        nomeUsuarioId.innerHTML = nomeUsuario;

        verificarBotaoUsuarios();
        verificarSuporte();
        esconderGraficos();
    };

    let mediaMaxima = [];
    let mediaMinima = [];

    let hectaresLabel = [];

    let limiteMaximo = [];
    let limiteMinimo = [];

    let porcentagemPPFDG = 0; /* Variável que futuramente vai receber uma equação da relação entre as áreas adequadas e o total de áreas.*/

    let quantidadeHectares = 0;

    /* GRAFICO DE PIZZA */

    /* Variáveis de contagem que serão usadas na produção do gráfico de pizza.*/
    let acima = 0;
    let abaixo = 0;
    let normal = 0;

    let meta = 0;

    function esconderGraficos() {
        let graficos = document.getElementById("div_graficos");
        graficos.style.display = "none";

        let botaoVoltar = document.getElementById("btn_voltar");
        botaoVoltar.style.display = "none";
    }

    function irCadastro() {
        window.location.href = `../../Cadastro.html`;
    }

    function transformarDataBR(data) {
        let dataAtualizada = "";
        let dataFutura = "";

        for (let i = 8; i <= 9; i++) {
            dataAtualizada += data[i];
        }
        dataFutura = Number(dataAtualizada) + 6;

        if (dataFutura > 31) {

            let mensagem = `Dados da semana do dia ${dataAtualizada}`
            return mensagem;
        }

        dataAtualizada += "/";
        dataFutura += "/";

        for (let i = 5; i <= 6; i++) {
            dataAtualizada += data[i];
            dataFutura += data[i];
        }

        dataAtualizada += "/";
        dataFutura += "/";

        for (let i = 0; i <= 3; i++) {
            dataAtualizada += data[i];
            dataFutura += data[i];
        }

        let mensagem = `Dados de ${dataAtualizada} até ${dataFutura}`;
        return mensagem;
    }

    function atualizarDisplay() {
        let data = ipt_data.value;

        let SelecionarData = document.getElementById("SelecionarData");
        SelecionarData.style.display = "none";

        let graficos = document.getElementById("div_graficos");
        graficos.style.display = "flex";

        let botaoVoltar = document.getElementById("btn_voltar");
        botaoVoltar.style.display = "flex";

        let mensagem = transformarDataBR(data);
      
        let p_header = document.getElementById("p_header");
        p_header.innerHTML = mensagem;
        console.log(data);
    }

    function carregarDados() {
        let data = ipt_data.value;

        if (data == "") {
            
            alert("Você esqueceu de colocar uma data")
            return;
        }

        console.log(data);

        atualizarDisplay();

        /* Carregadar os dados na tela ao iniciar a página */

        let idAreaPlantio = sessionStorage.getItem("ID_AREA_PLANTIL");

        fetch(`/area/filtrarData/${idAreaPlantio}/${data}`)
            .then((res) => res.json())
            .then((dados) => {
                console.log(dados);
                plotarHectares(dados);
            })
            .catch((erro) => {
                console.log("Erro: ", erro);
            });
    }

    function transformarPPFD(valor) {
        let valorBits = Number(valor);

        let valorLux = (valorBits / 1023) * 100000;

        let valorPPFD = Math.floor(valorLux * 0.0185);

        return valorPPFD;
    }

    function plotarHectares(dados) {
        for (let i = 0; i < dados.length; i++) {
            mediaMaximaPPFD = transformarPPFD(dados[i].Media_Maxima);
            mediaMinimaPPFD = transformarPPFD(dados[i].Media_Minima);

            mediaMaxima.push(mediaMaximaPPFD);
            mediaMinima.push(mediaMinimaPPFD);

            hectaresLabel.push(`Hectare ${i + 1}`);
            limiteMaximo.push(1500);
            limiteMinimo.push(400);
        }
        quantidadeHectares = dados.length;

        for (let i = 0; i < quantidadeHectares; i++) {
            if (mediaMaxima[i] > limiteMaximo[0]) {
                gridMapa.innerHTML += `<a
              class="area"
              style="background-color: rgb(201, 6, 6)" onclick='salvarIdHectare(${dados[i].idHectare
                    })'>Hectare ${i + 1}</a>`;
            } else if (mediaMinima[i] < limiteMinimo[0]) {
                gridMapa.innerHTML += `<a
              class="area"
              style="background-color: rgb(237, 89, 89)" onclick='salvarIdHectare(${dados[i].idHectare
                    })'>Hectare ${i + 1}</a>`;
            } else {
                gridMapa.innerHTML += `<a
              class="area"
              style="background-color: rgb(104, 197, 76)" onclick='salvarIdHectare(${dados[i].idHectare
                    })'>Hectare ${i + 1}</a>`;
            }
        }

        /* for utilizado para determinar a quantidade de áreas inadequadas / alertas */

        /* calculo utilizado para gerar a porcentagem de aproveitamento da área, sendo o total de áreas adquadas dividido pelo total */

        /* for que gera o nosso mapa de calor, já com as cores equivalentes */

        //   }

        /* for para fazer a contagem dos valores que serão utilizados no dado de pizza */
        for (
            let qtdAreasPizza = 0;
            qtdAreasPizza < quantidadeHectares;
            qtdAreasPizza++
        ) {
            if (mediaMaxima[qtdAreasPizza] > limiteMaximo[0]) {
                acima++;
            } else if (mediaMinima[qtdAreasPizza] < limiteMinimo[0]) {
                abaixo++;
            } else {
                normal++;
            }
        }

        plotarGraficos();
    }

    function plotarGraficos() {
        const grafLinha = document.getElementById("graficoLinha");

        new Chart(grafLinha, {
            type: "bar",
            data: {
                labels: hectaresLabel,
                datasets: [
                    {
                        label: "Média do PPFD Máximo",
                        data: mediaMaxima,
                        backgroundColor: "#3b6cb7",
                        borderColor: "#3b6cb7",
                    },
                    {
                        label: "Média do PPFD Mínimo",
                        data: mediaMinima,
                        backgroundColor: "#e67e22",
                        borderColor: "#e67e22",
                    },
                    {
                        label: "Limite Superior",
                        data: limiteMaximo,
                        type: "line",
                        borderColor: "#888",
                        borderWidth: 2,
                        pointRadius: 0,
                    },
                    {
                        label: "Limite infeirior",
                        data: limiteMinimo,
                        type: "line",
                        borderColor: "#f1c40f",
                        borderWidth: 2,
                        pointRadius: 0,
                    },
                ],
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom",
                    },
                    title: {
                        display: true,
                        text: "Média Semanal de incidência solar (PPFD) por Sensor",
                    },
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: "PPFD",
                        },
                    },
                },
            },
        });

        /* GRAFICO DE PIZZA */

        const grafPizza = document.getElementById("graficoPizza");

        new Chart(grafPizza, {
            type: "pie",
            data: {
                labels: ["Acima da limite", "Adequado", "Abaixo do limite"],
                datasets: [
                    {
                        data: [acima, normal, abaixo],
                        backgroundColor: [
                            "rgb(201, 6, 6)",
                            "rgb(104, 197, 76)",
                            "rgb(237, 89, 89)",
                        ],
                    },
                ],
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom",
                    },
                    title: {
                        display: true,
                        text: "Controle das Hectare",
                    },
                },
            },
        });
    }
    /* Função que deixa a opção do cliente estipular a meta adequada para ele da produtividade desejada */

    function mudarMeta() {
        let meta = prompt("Digite a nova meta desejada");
        let idAreaPlantio = sessionStorage.getItem("ID_AREA_PLANTIL");

        fetch(`/dashboard/mudarMeta/${idAreaPlantio}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                meta: meta,
            }),
        });

        window.location.reload();
    }

    function SobrePFFD() {
        document.getElementById("modal").style.display = "flex";

        tituloModal.innerHTML = "O que é o PPFD";
        textoModal.innerHTML = `Traduzindo do inglês, PPFD significa 'Densidade de Fluxo de Fótons Fotossintéticos' De forma simples, é a medida da intensidade da luz que realmente pode ser utilizada pelas plantas no processo de fotossíntese. Ou seja, indica quanta “luz útil” está disponível para o desenvolvimento da planta. <br> <br>

                  Saiba mais: <a href="https://masterplants.com.br/o-que-e-dli-e-ppfd-qual-a-sua-relacao-e-importancia-em-cultivos/"> Mais detalhes sobre o PPFD </a>`;
    }

    function sobreMeta() {
        document.getElementById("modal").style.display = "flex";
        tituloModal.innerHTML = "O que as metas siginicam";
        textoModal.innerHTML = `O PPFD representa a quantidade de luz útil que a soja recebe para realizar a fotossíntese.
              Quando está abaixo do ideal, a planta cresce menos e produz pouca energia.
              Na faixa adequada, há desenvolvimento saudável e boa produtividade.
              Já acima do limite, o excesso de luz causa estresse e prejudica o funcionamento da planta.
              Em casos extremos, pode ocorrer fotoinibição e até “queima” das folhas. <br> <br>

              Fontes: <br> <a href="https://www.mdpi.com/2073-4395/15/5/1037"> Artigo 1 (Impactos da quantidade abaixo de 400 PPFD) </a>
              <br> <a href="https://www.sciencedirect.com/science/article/abs/pii/037842909390053P"> Artigo 2 (Ineficiência acima do limite) </a>
              <br> <a href="    https://www.mdpi.com/2073-4395/9/8/428"> Artigo 3 (Testes na fase adquada) </a>

              `;
    }

    function fecharModal() {
        document.getElementById("modal").style.display = "none";
    }

    function salvarIdHectare(idHectare) {
        sessionStorage.ID_HECTARE = idHectare;
        console.log(sessionStorage.ID_HECTARE);
    }
</script>

</html>
