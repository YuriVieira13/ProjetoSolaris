<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="../sidebar.css" />
        <link rel="stylesheet" href="../global.css" />
        <link rel="stylesheet" href="./funcionarioDash.css" />
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="../../js/verificarCargo.js"></script>
        <title>Document</title>
    </head>

    <body>
        <div class="div_container">
            <aside class="sidebar">
                <img
                    src="./assets/imgs/logo.png"
                    alt="Logo solaris"
                    class="img_logo"
                />
                <h4 class="nomeUsuario" id="nomeUsuarioId">—</h4>
                <div class="div_barra"></div>

                <nav class="navbar">
                    <a href="./index.html" class="btn_sidebar">Dashboard</a>
                    <a
                        class="btn_sidebar"
                        href="./historico.html"
                        style="
                            background: rgba(255, 255, 255, 0.22);
                            border-color: rgba(255, 255, 255, 0.4);
                        "
                        >Histórico</a
                    >
                    <a
                        class="btn_sidebar"
                        href="./funcionariosDash.html"
                        id="btn_usuarios"
                        >Usuários</a
                    >
                    <a href="../dashboard.html" class="btn_sidebar"
                        >Selecionar Área</a
                    >
                </nav>

                <div class="div_barra"></div>

                <div class="infoConta">
                    <button onclick="irCadastro()" class="btn_sidebar">
                        Cadastrar Funcionário
                    </button>
                    <button
                        class="btn_sidebar"
                        onclick="sessionStorage.clear(); window.location.href='/index.html';"
                        style="
                            background: rgba(220, 50, 50, 0.25);
                            border-color: rgba(220, 50, 50, 0.5);
                        "
                    >
                        Sair
                    </button>
                </div>
            </aside>

            <div class="div_conteudo">
                <div class="header">
                    <p class="p_header">Primeira área de plantio</p>
                </div>

                <div class="main">
                    <div class="div_cards">
                        <div class="div_card">
                            <span>Total de Usuários</span>
                            <h1 id="qtdUsuarios">0</h1>
                            <p>Cadastrados</p>
                        </div>

                        <div class="div_card">
                            <span>Administradores</span>
                            <h1 id="qtdAdministradores">0</h1>
                            <p>Usuários</p>
                        </div>

                        <div class="div_card">
                            <span>Suportes</span>
                            <h1 id="qtdSuportes">0</h1>
                            <p>Usuários</p>
                        </div>

                        <div class="div_card">
                            <span>Funcionários</span>
                            <h1 id="qtdFuncionarios">0</h1>
                            <p>Usuários</p>
                        </div>
                    </div>

                    <div class="box_funcionarios">
                        <div class="div_filtros">
                            <input
                                type="text"
                                id="iptPesquisa"
                                placeholder="Pesquisar funcionário..."
                                onkeyup="filtrarFuncionarios()"
                            />

                            <select
                                id="selectCargo"
                                onchange="filtrarFuncionariosCargo()"
                            >
                                <option value="">Todos os cargos</option>
                                <option value="funcionario">Funcionário</option>
                                <option value="administrador">
                                    Administrador
                                </option>
                                <option value="suporte">Suporte</option>
                            </select>

                            <a class="btn_cadastrar" href="../../Cadastro.html">
                                Cadastrar Funcionário
                            </a>
                        </div>

                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Cargo</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>

                            <tbody id="tbodyFuncionarios"></tbody>
                        </table>
                    </div>
                </div>

                <div class="icon-bob-AI">
                    <a href="../bobAI.html"
                        ><img src="../../assets/icons/icon-bob-ai.png" alt=""
                    /></a>
                </div>
            </div>
        </div>
    </body>

    <script>
        window.onload = function () {
            var idUsuario = sessionStorage.getItem("ID_USUARIO");
            if (!idUsuario) {
                window.location.href = "../../Login.html";
                return;
            }

            var idFazenda = sessionStorage.getItem("ID_FAZENDA");
            if (!idFazenda) {
                window.location.href = "../fazendas.html";
                return;
            }

            var nomeUsuario = sessionStorage.getItem("NOME_USUARIO") || "—";
            console.log(nomeUsuario);
            nomeUsuarioId.innerHTML = nomeUsuario;

            verificarBotaoUsuarios();
            verificarSuporte();
            listarFuncionarios();
        };

        function irCadastro() {
            window.location.href = `../../Cadastro.html`;
        }

        let listaFuncionarios = [];

        fetch(`/dashboard/listarFuncionarios/${fkFazenda}`)
            .then((res) => res.json())
            .then((dados) => {
                listaFuncionarios = dados;
                exibirFuncionarios(listaFuncionarios);
            })
            .catch((erro) => {
                console.log(erro);
            });

        function exibirFuncionarios(lista) {
            tbodyFuncionarios.innerHTML = "";

            for (let i = 0; i < lista.length; i++) {
                tbodyFuncionarios.innerHTML += `
        <tr>
            <td>${lista[i].nome}</td>
            <td>${lista[i].email}</td>
            <td>${lista[i].cargo}</td>
            <td>
                <i class="bi bi-pencil-square"></i>
                <i class="bi bi-trash"
                   onclick="deletarFuncionario(${lista[i].idUsuario})"></i>
            </td>
        </tr>
        `;
            }
        }

        function filtrarFuncionarios() {
            let pesquisa = iptPesquisa.value.toLowerCase();

            let funcionariosFiltrados = [];

            for (let i = 0; i < listaFuncionarios.length; i++) {
                if (
                    listaFuncionarios[i].nome.toLowerCase().includes(pesquisa)
                ) {
                    funcionariosFiltrados.push(listaFuncionarios[i]);
                }
            }

            exibirFuncionarios(funcionariosFiltrados);
        }

        function filtrarFuncionariosCargo() {
            let pesquisa = selectCargo.value.toLowerCase();

            let funcionariosFiltrados = [];

            for (let i = 0; i < listaFuncionarios.length; i++) {
                if (
                    listaFuncionarios[i].cargo.toLowerCase().includes(pesquisa)
                ) {
                    funcionariosFiltrados.push(listaFuncionarios[i]);
                }
            }

            exibirFuncionarios(funcionariosFiltrados);
        }

        function deletarFuncionario(idUsuario) {
            let validar = prompt(
                "Voce Realmente deseja excluir esse usuario? Digite 'Sim' ou 'Não' "
            ).toLowerCase();

            console.log(validar);
            if (validar == "sim") {
                fetch(`/dashboard/deletarFuncionario/${idUsuario}`, {
                    method: "DELETE",
                })
                    .then((res) => {
                        if (res.ok) {
                            listarFuncionarios();
                        } else {
                            alert("Erro ao excluir funcionário");
                        }
                    })
                    .catch((erro) => {
                        console.log(erro);
                    });
            } else {
                return;
            }
        }
    </script>
</html>
