<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./sidebar.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/transporte.js"></script>
    <title>Document</title>
  </head>
  <body onload="verificarCargo()">
    <div class="div_container">
      <aside class="sidebar">
        <img src="./assets/imgs/logo.png" alt="Logo solaris" class="img_logo" />

        <div class="div_barra"></div>

        <nav class="navbar">
          <h4 class="nomeUsuario">SELECIONE A ÁREA DESEJADA</h4>
          <div id="areas_button"></div>
        </nav>

        <div class="div_barra"></div>
        <div class="div_btnCadastro">
          <a
            href="../Cadastro.html"
            class="btn_sidebar btn_cadastroSide btn_cadastrar"
            >Cadastrar Funcionario</a
          >
        </div>
      </aside>

      <div class="main">
        <h4 class="tituloMapa">Clique no mapa na area desejada</h4>
      </div>
    </div>
  </body>

  <script>
    window.onload = carregarDados();

    function carregarDados() {
      if (sessionStorage.CARGO_USUARIO != `Administrador`) {
        document.querySelector(".btn_cadastrar").style.display = `none`;
      }

      let idUsuario = sessionStorage.getItem("ID_USUARIO");

      fetch(`/area/listarArea/${idUsuario}`)
        .then((res) => res.json())
        .then((dados) => {
          plotarAreas(dados);
        })
        .catch((erro) => {
          console.log("Erro:", erro);
        });
    }

    function plotarAreas(dados) {
      for (let i = 0; i < dados.length; i++) {
        areas_button.innerHTML += `<a href="#" class="btn_sidebar" onclick="direcionar(${dados[i].idAreaPlantio})">
            Área de Plantio ${i + 1}
            </a>`;
      }
    }
  </script>
</html>
