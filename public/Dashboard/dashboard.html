<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./sidebar.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/transporte.js"></script>
    <script src="../js/verificarCargo.js"></script>
    <title>Solaris - Selecionar Área</title>
  </head>
  <body>
    <div class="div_container">
      <aside class="sidebar">
        <img src="./assets/imgs/logo.png" alt="Logo solaris" class="img_logo" />
        <h4 class="nomeUsuario" id="nomeUsuario">—</h4>
        <div class="div_barra"></div>

        <nav class="navbar">
          <a href="./fazendas.html" class="btn_sidebar">Voltar para Fazendas</a>
        </nav>

        <div class="div_barra"></div>

        <nav class="navbar" id="areas_button">
          <h4 class="panel-titulo">Selecione a área</h4>
        </nav>

        <div class="div_barra"></div>

        <div class="infoConta">
          <button id="botao_cadastrar" onclick="irCadastro()" class="btn_sidebar">
            Cadastrar Funcionário
          </button>
          <button
            class="btn_sidebar btn_sair"
            onclick="
              sessionStorage.clear();
              window.location.href = '/index.html';
            "
          >
            Sair
          </button>
        </div>
      </aside>

      <div class="main" id="main">
        <div class="header">
          <div class="header-dot"></div>
          <div class="header-info">
            <span class="header-nome" id="header-nome">FAZENDA</span>
            <span class="header-endereco">
              <i class="bi bi-geo-alt-fill"></i>
              <span id="header-endereco">—</span>
            </span>
          </div>
        </div>
        <div class="mapa" id="mapa"></div>
      </div>
    </div>
  </body>

  <script>
    window.onload = function () {
      var idUsuario = sessionStorage.getItem("ID_USUARIO");
      if (!idUsuario) {
        window.location.href = "../Login.html";
        return;
      }

      verificarAdministrador()

      var nomeUsuario = sessionStorage.getItem("NOME_USUARIO") || "—";
      document.getElementById("nomeUsuario").innerText = nomeUsuario;

      if (sessionStorage.getItem("CARGO_USUARIO") !== "administrador") {
        // sem botão de cadastro para não-admins (mantém comportamento original)
      }

      var idFazenda = sessionStorage.getItem("ID_FAZENDA");
      if (!idFazenda) {
        window.location.href = "./fazendas.html";
        return;
      }

      fetch("/area/listarAreaPorFazenda/" + idFazenda)
        .then(function (res) {
          return res.json();
        })
        .then(function (dados) {
          plotarAreas(dados);
        })
        .catch(function (erro) {
          console.log("Erro:", erro);
        });

      var idUsuario = sessionStorage.getItem("ID_USUARIO");
      if (!idUsuario) {
        window.location.href = "../Login.html";
        return;
      }

      var idFazenda = sessionStorage.getItem("ID_FAZENDA");
      if (!idFazenda) {
        window.location.href = "./fazendas.html";
        return;
      }

      var nomeUsuario = sessionStorage.getItem("NOME_USUARIO") || "—";
      var nomeFazenda = sessionStorage.getItem("NOME_FAZENDA") || "Fazenda";
      var enderecoFazenda = sessionStorage.getItem("ENDERECO_FAZENDA") || "—";
      var imagemFazenda = sessionStorage.getItem("IMAGEM_FAZENDA");

      document.getElementById("nomeUsuario").innerText = nomeUsuario;
      document.getElementById("header-nome").innerText =
        nomeFazenda.toUpperCase();
      document.getElementById("header-endereco").innerText = enderecoFazenda;
      document.getElementById("mapa").style.backgroundImage = `url("./assets/imgs/${imagemFazenda}")`;
    };

    function plotarAreas(dados) {
      var container = document.getElementById("areas_button");
      if (!dados || dados.length === 0) {
        container.innerHTML =
          "<p style='color:rgba(255,255,255,0.6);font-size:12px;text-align:center;'>Nenhuma área encontrada.</p>";
        return;
      }
      for (var i = 0; i < dados.length; i++) {
        container.innerHTML +=
          '<a href="#" class="btn-area-panel" onclick="direcionar(' +
          dados[i].idAreaPlantio +
          ',' + (i + 1) + ')">' +
          (dados[i].nome || "Área de Plantio " + (i + 1)) +
          "</a>";
      }
    }

    function irCadastro() {
      window.location.href = `../../Cadastro.html`;
    }
  </script>
</html>
