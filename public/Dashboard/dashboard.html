<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./sidebar.css" />
    <link rel="stylesheet" href="./style.css" />
    <style>
      .header {
        width: 100%;
        background: linear-gradient(180deg, #6aa84f, #4e7f35);
        display: flex;
        align-items: center;
        gap: 18px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      }

      .header-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: white;
      }

      .header-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .header-nome {
        color: white;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        padding-bottom: 2px;
      }

      .header-endereco {
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .main {
        display: flex;
        flex-direction: column;
      }

      .main-body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .panel-areas {
        width: 210px;
        flex-shrink: 0;
        background: rgba(40, 70, 20, 0.82);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px 14px;
        overflow-y: auto;
      }

      .panel-titulo {
        color: rgba(255, 255, 255, 0.65);
        font-size: 11px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .btn-area-panel {
        display: block;
        width: 100%;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        color: white;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
        margin-bottom: 8px;
      }

      .btn-area-panel:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .mapa-wrapper {
        flex: 1;
        background-image: url("./assets/imgs/1.png");
        background-size: cover;
        background-position: center;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/transporte.js"></script>
    <title>Solaris - Selecionar Área</title>
  </head>
  <body>
    <div class="div_container">
      <aside class="sidebar">
        <img src="./assets/imgs/logo.png" alt="Logo solaris" class="img_logo" />
        <h4 class="nomeUsuario" id="nomeUsuario">—</h4>
        <div class="div_barra"></div>

        <nav class="navbar">
          <a href="./fazendas.html" class="btn_sidebar">Voltar para Fazendas</a>
        </nav>

        <div class="div_barra"></div>

        <nav class="navbar" id="areas_button">
          <h4 class="panel-titulo">Selecione a área</h4>
        </nav>

        <div class="div_barra"></div>

        <div class="infoConta">
          <button onclick="irCadastro()" class="btn_sidebar">
            Cadastrar Funcionário
          </button>
          <button
            class="btn_sidebar"
            onclick="
              sessionStorage.clear();
              window.location.href = '/index.html';
            "
            style="
              background: rgba(220, 50, 50, 0.25);
              border-color: rgba(220, 50, 50, 0.5);
            "
          >
            Sair
          </button>
        </div>
      </aside>

      <div class="main" id="main">
        <div class="header">
          <div class="header-dot"></div>
          <div class="header-info">
            <span class="header-nome" id="header-nome">FAZENDA</span>
            <span class="header-endereco">
              <i class="bi bi-geo-alt-fill"></i>
              <span id="header-endereco">—</span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>

  <script>
    window.onload = function () {
      var idUsuario = sessionStorage.getItem("ID_USUARIO");
      if (!idUsuario) {
        window.location.href = "../Login.html";
        return;
      }

      var nomeUsuario = sessionStorage.getItem("NOME_USUARIO") || "—";
      document.getElementById("nomeUsuario").innerText = nomeUsuario;

      if (sessionStorage.getItem("CARGO_USUARIO") !== "administrador") {
        // sem botão de cadastro para não-admins (mantém comportamento original)
      }

      var idFazenda = sessionStorage.getItem("ID_FAZENDA");
      if (!idFazenda) {
        window.location.href = "./fazendas.html";
        return;
      }

      fetch("/area/listarAreaPorFazenda/" + idFazenda)
        .then(function (res) {
          return res.json();
        })
        .then(function (dados) {
          plotarAreas(dados);
        })
        .catch(function (erro) {
          console.log("Erro:", erro);
        });

      var idUsuario = sessionStorage.getItem("ID_USUARIO");
      if (!idUsuario) {
        window.location.href = "../Login.html";
        return;
      }

      var idFazenda = sessionStorage.getItem("ID_FAZENDA");
      if (!idFazenda) {
        window.location.href = "./fazendas.html";
        return;
      }

      var nomeUsuario = sessionStorage.getItem("NOME_USUARIO") || "—";
      var nomeFazenda = sessionStorage.getItem("NOME_FAZENDA") || "Fazenda";
      var enderecoFazenda = sessionStorage.getItem("ENDERECO_FAZENDA") || "—";
      var imagemFazenda = sessionStorage.getItem("IMAGEM_FAZENDA");

      document.getElementById("nomeUsuario").innerText = nomeUsuario;
      document.getElementById("header-nome").innerText =
        nomeFazenda.toUpperCase();
      document.getElementById("header-endereco").innerText = enderecoFazenda;
      document.getElementById("main").style.backgroundImage = `url("./assets/imgs/${imagemFazenda}")`;
    };

    function plotarAreas(dados) {
      var container = document.getElementById("areas_button");
      if (!dados || dados.length === 0) {
        container.innerHTML =
          "<p style='color:rgba(255,255,255,0.6);font-size:12px;text-align:center;'>Nenhuma área encontrada.</p>";
        return;
      }
      for (var i = 0; i < dados.length; i++) {
        container.innerHTML +=
          '<a href="#" class="btn-area-panel" onclick="direcionar(' +
          dados[i].idAreaPlantio +
          ')">' +
          (dados[i].nome || "Área de Plantio " + (i + 1)) +
          "</a>";
      }
    }

    function irCadastro() {
      window.location.href = `../../Cadastro.html`;
    }
  </script>
</html>
